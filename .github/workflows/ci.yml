name: CI

on:
    pull_request:
    workflow_call:
    push:
        branches: [develop]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
            - uses: taiki-e/install-action@just
            - run: uv sync --frozen --dev
            - run: just lint
            - run: just format-check

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
            - uses: taiki-e/install-action@just
            - run: uv sync --frozen --dev
            - run: just typecheck

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
            - uses: taiki-e/install-action@just
            - run: uv sync --frozen --dev
            - run: just test --tb=short -q
