[project]
name = "trade-republic-pac"
version = "0.1.0"
description = "Automated portfolio rebalancing assistant for Trade Republic"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pytr[waf]>=0.4",
    "python-telegram-bot>=20.0",
    "starlette>=0.37",
    "uvicorn[standard]>=0.29",
    "structlog>=23.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
backtest = [
    "yfinance>=1.2.0",
    "quantstats>=0.0.81",
    "questionary>=2.1.1",
    "plotext>=5.2",
]
dashboard = [
    "fastapi>=0.115",
    "sse-starlette>=2.0",
    "markdown>=3.5",
    "nh3>=0.2",
]
research = ["matplotlib>=3.8", "tulipy>=0.4"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
    "httpx>=0.27",
    "pre-commit>=4.0",
    "pytest-bdd>=7.0",
    "pytest-xdist>=3.5",
    "pytest-sugar>=1.0",
    "pytest-randomly>=3.15",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "types-pyyaml>=6.0.12.20250915",
    "typer[all]>=0.12",
    "telethon>=1.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pac"]
exclude = ["**/tests/**", "**/features/**"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["dashboard\\.legacy"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
asyncio_mode = "auto"
timeout = 30
addopts = "--ignore-glob=**/dashboard.legacy/**"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["yfinance.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["quantstats.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytr.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sse_starlette.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["curl_cffi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["plotext.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tulipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nicegui.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["starlette.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["telethon.*", "questionary.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pac.backtester.dashboard.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["markdown.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nh3.*"]
ignore_missing_imports = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "angular"
commit_message = "chore(release): v{version}"
build_command = ""
tag_format = "v{version}"

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore\\(", "^ci\\(", "^docs\\(", "^style\\("]

[tool.semantic_release.remote]
type = "github"
