# pac-backtest.yaml — backtest config with proxy tickers for 1996-2025 validation
# Uses proxy ticker chains to extend price coverage before primary ETFs existed.

version: 1

# ─── Application (placeholders — not used by backtester) ─────
app:
  log_level: INFO
  dev_mode: true
  port: 8080
  job_secret: "backtest-only"

# ─── Broker (placeholders — not used by backtester) ──────────
broker:
  type: trade_republic
  phone_number: "+0000000000"
  pin: "0000"

# ─── Assets with proxy ticker chains ────────────────────────
assets:
  - id: stocks
    name: Stocks (FTSE All-World EUR)
    isin: IE00BK5BQT80
    ticker: "VWCE.DE"
    currency: "EUR"
    target_pct: 70
    proxy_chain:
      - ticker: "^SP500TR"
        end: "2009-09-24"
        currency: "USD"
      - ticker: "IWDA.AS"
        end: "2019-07-28"
        currency: "EUR"

  - id: gold
    name: Gold ETC (GBP)
    isin: IE00B4ND3602
    ticker: "SGLN.L"
    currency: "GBP"
    target_pct: 15
    proxy_chain:
      - ticker: "GC=F"
        end: "2011-04-07"
        currency: "USD"

  - id: bonds
    name: Bond ETF (US Aggregate)
    isin: IE00B3F81409
    ticker: "AGG"
    currency: "USD"
    target_pct: 15
    proxy_chain:
      - ticker: "VBMFX"
        end: "2003-09-21"
        currency: "USD"

# ─── Delivery channels (none — backtester only) ─────────────
channels: {}

# ─── Signal definitions ─────────────────────────────────────
signals:
  - name: crisis_composite
    rule: crisis_composite
    schedule: daily
    channels: []
    template: crisis_alert
    params:
      equity_asset_id: stocks
      gold_asset_id: gold
      min_active_indicators: 3
      drawdown_warning_pct: -12.0
      drawdown_critical_pct: -20.0
      velocity_warning: -0.25
      velocity_critical: -0.50
      divergence_warning_pct: 12.0
      divergence_critical_pct: 20.0
      rs_ma_window: 120
      rs_warning_pct: 8.0
      rs_critical_pct: 15.0
      death_cross_short_window: 50
      death_cross_long_window: 200
      equity_lookback_days: 450
      gold_lookback_days: 250
      drawdown_lookback_bars: 252
      divergence_lookback_bars: 40
